<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 14px; margin: 0; background-color: #f9fafb; }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #111827; text-align: center; }
    .status-box { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; margin-bottom: 12px; }
    button { width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    #scanBtn { background: #2563eb; color: white; }
    #scanBtn:hover { background: #1d4ed8; }
    #exportBtn { background: #059669; color: white; }
    #exportBtn:hover { background: #047857; }
  </style>
</head>
<body>
  <h3>🛡️ AI Phishing Detector</h3>
  <div id="status" class="status-box">Ready to scan current page</div>
  <button id="scanBtn">Scan Webpage</button>
  <button id="exportBtn">Export Threat Log</button>

  <script src="popup.js"></script>
</body>
</html>
